<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>G胖儿GongPan</title>
    <!-- Favicon, Manifest & Application Icons for All Browsers & Platforms -->
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/logo-light.jpg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GongPan" />

    <!-- Resource Hints & Image Preconnects for ultra-fast asset loading -->
    <link rel="dns-prefetch" href="https://pic1.imgdb.cn" />
    <link rel="preconnect" href="https://pic1.imgdb.cn" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://img2.nloln.de" />

    <!-- Preload critical logos for instant theme switching & zero-lag rendering -->
    <link rel="preload" as="image" href="https://pic1.imgdb.cn/i/034Btz7zzuwPNEbWvK0iIG.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="https://pic1.imgdb.cn/i/034Btz7qvfI0vFKCCLUwsk.jpg" fetchpriority="high" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('gongpan_theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var favicon = document.getElementById('dynamic-favicon');
            if (favicon) {
              favicon.href = 'https://pic1.imgdb.cn/i/034Btz7qvfI0vFKCCLUwsk.jpg';
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Smooth scrolling */
      html { scroll-behavior: smooth; }
      
      /* Globally hide scrollbars */
      html, body {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE and Edge */
        overflow-x: hidden; /* Prevent horizontal scroll */
        -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        -webkit-touch-callout: none !important; /* Disable iOS Safari link peek/preview on long press */
      }
      
      a, img, button, [role="button"] {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
      }
      
      html::-webkit-scrollbar, body::-webkit-scrollbar {
        display: none; /* Chrome, Safari and Opera */
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Cursive fallbacks using local fonts if possible, or standard serif/cursive */
      .font-cursive-en { font-family: "Snell Roundhand", "Apple Chancery", cursive; }
      .font-cursive-cn { font-family: "KaiTi", "STKaiti", serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
